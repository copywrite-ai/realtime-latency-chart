<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Latency Chart Demo</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 20% 20%, #1f334a 0%, #0e1825 60%, #0a111a 100%);
        color: #d8e6f8;
      }
      .wrap {
        max-width: 980px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .card {
        border: 1px solid rgba(138, 169, 205, 0.22);
        border-radius: 12px;
        padding: 12px;
        background: rgba(10, 19, 30, 0.55);
        backdrop-filter: blur(6px);
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 12px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      #stats { color: #cbe0ff; font-family: ui-monospace, Menlo, Consolas, monospace; text-transform: none; }
      #chart {
        width: 100%;
        height: 220px;
        display: block;
      }
      .controls {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }
      button {
        border: 1px solid rgba(142, 174, 211, 0.38);
        background: rgba(39, 67, 96, 0.65);
        color: #eff6ff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Realtime Latency Chart</h1>
      <div class="card">
        <div class="head">
          <span>Command Ack Latency (ms)</span>
          <span id="stats">-</span>
        </div>
        <canvas id="chart"></canvas>
      </div>
      <div class="controls">
        <button id="toggle">Pause</button>
        <button id="spike">Inject Spike</button>
      </div>
    </div>
    <script type="module" src="/examples/main.ts"></script>
  </body>
</html>
